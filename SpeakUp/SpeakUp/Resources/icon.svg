<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Speech bubble — bold, chunky -->
  <g transform="translate(512, 460)">
    <!-- Bubble body -->
    <rect x="-260" y="-220" width="520" height="380" rx="110" fill="white"/>

    <!-- Bubble tail — pointing down-left -->
    <path d="M-200,160 L-360,310 L-140,190 Z" fill="white"/>

    <!-- Upward arrow inside — bold, clear -->
    <g transform="translate(0, -10)">
      <path d="M0,-100 L0,100" stroke="#4F46E5" stroke-width="44" stroke-linecap="round"/>
      <path d="M-70,-30 L0,-110 L70,-30" fill="none" stroke="#4F46E5" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
