name: SpeakUp
options:
  bundleIdPrefix: com.duanaoios.speakup
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_FILE: SpeakUp/Resources/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  SpeakUp:
    type: application
    platform: iOS
    sources:
      - path: SpeakUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanaoios.speakup
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SpeakUp/Resources/Info.plist
    dependencies:
    info:
      path: SpeakUp/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpeakUp
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: systemIndigo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "SpeakUp needs microphone access for voice recording and speech practice."
        NSSpeechRecognitionUsageDescription: "SpeakUp uses speech recognition to convert your voice to text for English speaking practice."
